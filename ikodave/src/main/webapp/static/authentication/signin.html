<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Sign In</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />

    <link href="/static/authentication/auth.css" rel="stylesheet"/>
    <link href="/static/shared_html/navbar.css" rel="stylesheet">
</head>
<body>
<div id="navbar-container"></div>
<script src="/static/shared_html/navbar.js"></script>

<div id="error-msg" class="mt-3 text-center"></div>

<div class="auth-container">
    <div class="card auth-card rounded-4 p-4">
        <h2 class="text-center mb-4">Sign In</h2>
        <form id="signin-form">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input
                        type="text"
                        class="form-control"
                        id="username"
                        name="username"
                        placeholder="Enter username"
                        required
                />
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        required
                />
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-3">Sign In</button>

            <p class="text-center">
                <div
                    id="g_id_onload"
                    data-client_id="143211445052-tql6as8lmt5samgbpf16errprt1j62hb.apps.googleusercontent.com"
                    data-callback="handleGoogleCredential"
                    data-auto_prompt="false">
                </div>

                <div
                        class="g_id_signin"
                        data-type="standard"
                        data-size="large"
                        data-theme="outline"
                        data-text="signin_with"
                        data-shape="pill"
                        data-logo_alignment="left">
                </div>
            </p>

            <p class="text-center">
                No account? <a href="/registration">Register</a>
            </p>
        </form>
    </div>
</div>

<div class="animation-area">
    <ul class="circles">
        <li></li><li></li><li></li><li></li><li></li>
        <li></li><li></li><li></li><li></li><li></li>
    </ul>
    <ul class="squares">
        <li></li><li></li><li></li><li></li><li></li>
    </ul>
    <ul class="triangles">
        <li></li><li></li><li></li><li></li><li></li>
    </ul>
</div>


<script src="/static/authentication/signin.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
